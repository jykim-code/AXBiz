<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카드 미리보기 — 접힘 라벨 비교 / 펼침 잉크</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<script>
  tailwind.config = { theme: { extend: {
    colors: { lime: '#c8f200', beige: '#f7f5f0', ink: '#111', 'lime-600': '#7ba500' },
    fontFamily: { sans: ['Inter','sans-serif'], display: ['"Space Grotesk"','sans-serif'] },
  } } };
</script>
<style>
  body { background:#f7f5f0; color:#111; font-family:'Inter',sans-serif; }
  h1,h2,h3,h4,h5,h6 { font-family:'Space Grotesk',sans-serif; }
  /* max-height 컬랩스: 접힘 시 0 + overflow:hidden 으로 한 px도 새지 않음 */
  .card-body { max-height:0; overflow:hidden; transition:max-height .45s ease; }
  .card.open .card-body { max-height:3000px; }
  .card.open .chev { transform:rotate(180deg); }
</style>
</head>
<body class="p-8">
<div class="max-w-[1100px] mx-auto space-y-12">

  <header>
    <h1 class="text-3xl font-bold tracking-tight mb-1">카드 미리보기</h1>
    <p class="opacity-70">상단 요약 텍스트는 <b>검정 볼드</b>로 강조했습니다. 펼침 박스는 <b>잉크(검정)</b> 확정.
      접힘 상태에 "주요 내용/기간 종합" 같은 <b>헤더 라벨</b>을 넣을지 두 안을 비교해 주세요.</p>
  </header>

  <!-- 접힘 비교 -->
  <section>
    <h2 class="text-xl font-bold mb-4">접힘 상태 — 헤더 라벨 비교 (클릭하면 펼쳐집니다)</h2>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <div>
        <div class="inline-block text-sm font-bold bg-ink text-lime rounded-full px-3 py-1 mb-3">안 1 · 라벨 없음 (현재)</div>
        <div class="space-y-4" id="noLabel"></div>
      </div>
      <div>
        <div class="inline-block text-sm font-bold bg-lime text-ink rounded-full px-3 py-1 mb-3">안 2 · 헤더 라벨 포함</div>
        <p class="text-xs opacity-60 mb-3">1건 → "주요 내용", 2건+ → "기간 종합" 라벨을 요약 위에 표시</p>
        <div class="space-y-4" id="withLabel"></div>
      </div>
    </div>
  </section>

  <!-- 펼침(잉크) 확인 -->
  <section>
    <h2 class="text-xl font-bold mb-1">펼친 모습 — 잉크(검정) 박스 확정</h2>
    <p class="text-sm opacity-60 mb-4">"기간 종합" 라벨은 다른 섹션처럼 본문 안 텍스트로, 내용만 잉크 박스에 담깁니다.</p>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start" id="expanded"></div>
  </section>

</div>

<script>
const ICON_EXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-lime-600 flex-none"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>';
const ICON_CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="m6 9 6 6 6-6"/></svg>';
const LBL = (t) => '<div class="text-[11px] font-bold uppercase tracking-widest text-lime-600 mb-1">'+t+'</div>';

function detail(e){
  return '<div class="space-y-3">'+
    '<div>'+LBL('주요 내용')+'<p class="text-sm leading-relaxed">'+e.kp+'</p></div>'+
    '<div>'+LBL('시사점')+'<p class="text-sm leading-relaxed opacity-90">'+e.im+'</p></div>'+
    '<div class="bg-lime/15 border border-lime/40 rounded-xl p-3">'+LBL('한컴 인사이트')+'<p class="text-sm leading-relaxed">'+e.hi+'</p></div>'+
  '</div>';
}

// 기간 종합: 라벨(텍스트) + 내용(잉크 박스)
function periodSummaryBlock(co){
  return '<div>'+LBL('기간 종합')+
    '<div class="bg-ink rounded-xl p-3"><p class="text-sm leading-relaxed text-white opacity-90">'+co.summary+'</p></div></div>';
}

function bodyHTML(co){
  const entries = co.entries, n = entries.length;
  let body = '';
  if (n>1){
    body += periodSummaryBlock(co);
    body += '<div class="space-y-5 border-l-2 border-lime/40 pl-5">';
    entries.forEach(e=>{
      body += '<div class="relative"><div class="absolute -left-[27px] top-1.5 w-3 h-3 rounded-full bg-lime border-2 border-white"></div>'+
        '<div class="text-xs font-bold text-lime-600 mb-2">'+e.date+'</div>'+detail(e)+'</div>';
    });
    body += '</div>';
  } else {
    body += detail(entries[0]);
  }
  body += '<div class="flex flex-wrap gap-2">'+co.tags.map(t=>'<span class="text-xs opacity-80 bg-beige border border-ink/5 rounded-full px-3 py-1">#'+t+'</span>').join('')+'</div>';
  return body;
}

// showLabel: 접힘 헤더에 "주요 내용/기간 종합" 라벨 표시 여부
function card(co, opts){
  opts = opts || {};
  const entries = co.entries, n = entries.length, latest = entries[0];
  const badge = n>1 ? '<span class="text-[10px] font-bold text-lime-600 bg-lime/15 rounded-full px-2 py-0.5 flex-none">'+n+'건</span>' : '';
  const date = '<span class="text-[11px] text-ink/55 font-medium ml-auto flex-none">'+latest.date+'</span>';
  const openCls = opts.open ? ' open' : '';
  const headLabel = opts.showLabel ? LBL(n>1 ? '기간 종합' : '주요 내용') : '';
  // 상단 요약: 검정 볼드
  const summaryLine = '<p class="text-sm font-bold text-ink mt-1.5 leading-snug">'+latest.kp+'</p>';
  return '<div class="card'+openCls+' group bg-white rounded-[24px] border border-ink/5 shadow-xl shadow-ink/5 hover:-translate-y-1 transition-transform duration-300 cursor-pointer" onclick="if(!event.target.closest(\'a\'))this.classList.toggle(\'open\')">'+
    '<div class="p-6 flex items-start gap-3"><div class="flex-1 min-w-0">'+
      '<div class="flex items-center gap-2">'+
        '<a href="#" onclick="event.preventDefault()" class="font-display font-bold text-lg tracking-tight hover:text-lime-600 inline-flex items-center gap-1">'+co.name+ICON_EXT+'</a>'+
        badge+date+'</div>'+
      (headLabel ? '<div class="mt-1.5">'+headLabel+'</div>' : '')+
      summaryLine+
    '</div><span class="chev flex-none mt-1 opacity-75 transition-transform duration-300">'+ICON_CHEV+'</span></div>'+
    '<div class="card-body"><div class="px-6 pb-6 space-y-5">'+bodyHTML(co)+'</div></div>'+
  '</div>';
}

const NAVER = { name:'네이버', tags:['하이퍼클로바X','AI검색','에이전트'], summary:'',
  entries:[ {date:'2026-05-28', kp:'6월부터 AI 검색에 차세대 하이퍼클로바X 적용 발표, "AI 통합 에이전트" 구현 목표', im:'검색 트래픽을 생성형 AI로 방어하며 광고·커머스 연계 확대 포석', hi:'한컴독스 검색·요약에 자체 LLM 연계 시 차별화 여지'} ] };
const SDS = { name:'삼성SDS', tags:['패브릭스','AI에이전트','거버넌스'],
  summary:'5월 중순 멀티 LLM 허브로 패브릭스를 확장한 데 이어, 말에는 AX 서밋에서 "AI 에이전트 시대"를 선언하며 자산·모델·에이전트 통합 거버넌스로 B2B 전선을 넓혔다.',
  entries:[
    {date:'2026-05-29', kp:'AX 서밋 2026(320사·600명), 패브릭스 2.0(10월 출시 목표) 예고: 복수 에이전트 통합운영·통합 거버넌스, "챗봇 시대 끝, AI 에이전트 시대" 선언', im:'단일 LLM 경쟁에서 에이전트 오케스트레이션·거버넌스 경쟁으로 전환', hi:'한컴도 문서 자동화 에이전트의 통합관리/감사 기능이 차별점이 될 수 있음'},
    {date:'2026-05-15', kp:'패브릭스에 외부 LLM 추가 연동, 멀티 LLM 허브로 전환', im:'고객사 모델 선택권 강화로 락인 완화·확산 가속', hi:'멀티 LLM 라우팅은 한컴 제품에도 사실상 표준 요구사항이 될 전망'},
  ] };
const SKT = { name:'SK텔레콤', tags:['에이닷','AXMS','회의록'],
  summary:'사내 적용(에이닷 비즈 코워크)→전사 관리체계(AXMS 1.5)→문화 정착(AX 챌린지)으로 이어지며, 내부 생산성 도구를 전사 AX 운영체계로 끌어올렸다.',
  entries:[
    {date:'2026-05-28', kp:"AI 에이전트 '에이닷 비즈 코워크' 베타 사내 적용(실행계획·코드작성·결과검증 자동)", im:'사내 도그푸딩으로 B2B 상품화 전 검증', hi:'실행-검증 루프형 에이전트는 한컴 문서 워크플로우에도 적용 여지'},
    {date:'2026-05-20', kp:"전사 AX 관리 'AXMS' 1.5 고도화", im:'AX 성과·리스크의 전사 관리체계화', hi:'도입 효과 측정 프레임은 한컴 내부 도입 시 참고 가능'},
    {date:'2026-05-12', kp:"'AX 챌린지' 정례화 · 회의록 60%·보고서 40% 단축 효과", im:'정량 효과 제시로 내부 확산 명분 확보', hi:'문서·회의 자동화 수치는 한컴 제품 가치 제안에 직접 인용 가능'},
  ] };

document.getElementById('noLabel').innerHTML   = [card(NAVER), card(SDS), card(SKT)].map(s=>s).join('');
document.getElementById('withLabel').innerHTML = [card(NAVER,{showLabel:true}), card(SDS,{showLabel:true}), card(SKT,{showLabel:true})].join('');
document.getElementById('expanded').innerHTML  = [card(NAVER,{open:true}), card(SDS,{open:true})].join('');
</script>
</body>
</html>
