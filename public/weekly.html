<style>
  body { background:#f7f5f0; color:#111; font-family:'Inter','Pretendard',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4,h5,h6 { font-family:'Space Grotesk','Pretendard',sans-serif; }
  ::selection { background:#c8f200; color:#111; }
  /* 접힘/펼침 — 대시보드 카드와 같은 max-height 컬랩스(본문이 한 px도 새지 않음) */
  .wk-body { max-height: 0; overflow: hidden; transition: max-height .4s ease; }
  .wk-open .wk-body { max-height: 6000px; }
  .wk-open .wk-chev { transform: rotate(180deg); }

  .wk-open .wk-preview { display: none; }
  /* 형광펜 강조 — 관리자가 ==강조== 로 감싼 구간. 라임 띠 + ink 글씨라 다크 히어로와 라이트 박스
     양쪽에서 읽힌다. box-decoration-break 로 줄바꿈될 때도 띠가 이어진다. */
  .wk-hl {
    background: #c8f200; color: #111; font-weight: 600;
    padding: 0 .18em; border-radius: 2px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  .wk-toggle:focus-visible { outline: 2px solid #7ba500; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .wk-body { transition: none; } }
