<style>

  h1,h2,h3,h4,h5,h6 { font-family:'Space Grotesk','Pretendard',sans-serif; }
  ::selection { background:#c8f200; color:#111; }
  /* 매거진 인덱스 조판(F안) — 카드(그림자·라운드 박스)를 쓰지 않고 굵은 선·얇은 선·활자 위계로만
     구분한다. 대시보드가 카드 문법을 쓰는 것과 의도적으로 다르다: 이 화면은 「발행물」이다. */
  .rule      { border-top:2px solid #111; }

  .num-out   { -webkit-text-stroke:1.5px rgba(17,17,17,.22); color:transparent; }
</style>
