<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HANCOM AX Biz Radar</title>
<link rel="icon" type="image/png" href="/assets/hancom_favicon.png" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { lime: '#c8f200', beige: '#f7f5f0', ink: '#111', 'lime-600': '#7ba500' },
        fontFamily: {
          sans: ['Inter', 'Pretendard', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          display: ['"Space Grotesk"', 'Pretendard', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  html { scroll-behavior: smooth; }
  body { background-color: #f7f5f0; color: #111; font-family: 'Inter', 'Pretendard', sans-serif; -webkit-font-smoothing: antialiased; }
  h1,h2,h3,h4,h5,h6 { font-family: 'Space Grotesk', 'Pretendard', sans-serif; }
  ::selection { background: #c8f200; color: #111; }
  .sn-reveal { opacity: 0; transform: translateY(20px); transition: opacity .6s ease, transform .6s ease; }
  .sn-reveal.sn-visible { opacity: 1; transform: translateY(0); }
  .col-scroll::-webkit-scrollbar { width: 8px; }
  .col-scroll::-webkit-scrollbar-thumb { background: rgba(17,17,17,.12); border-radius: 8px; }
  /* max-height 컬랩스: 접힘 시 0 + overflow:hidden 으로 본문이 한 px도 새지 않음(grid 0fr의 min-content 누수 방지) */
  .card-body { max-height: 0; overflow: hidden; transition: max-height .45s ease; }
  /* 카테고리 블록 구성 이후 한 건이 더 높아졌다. 월간 다건 카드(10건 이상)에서 본문이 잘리지 않게 여유를 둔다. */
  .card.open .card-body { max-height: 12000px; }
  .card.open .chev { transform: rotate(180deg); }
  /* 다건 카드의 접힘 줄은 기간 종합과 같은 문장이므로: 접힘=3줄까지만, 펼침=숨김(다크 박스가 전문 담당) */
  .card-summary.is-period { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .card.open .card-summary.is-period { display: none; }
  .card:focus-visible, [data-date]:focus-visible { outline: 2px solid #7ba500; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .sn-reveal { transition: none; }
    .card-body { transition: none; }
  }
</style>
<link rel="stylesheet" href="/assets/css/dark.css" />
<script>!function(){var s=localStorage.getItem('ax-dark');if(s==='1'||(s===null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}()</script>
</head>
<body class="min-h-screen bg-beige selection:bg-lime selection:text-ink">
<div class="flex flex-col min-h-screen lg:h-screen">

  <!-- ===== Nav ===== -->
  <nav class="flex-none bg-lime/90 backdrop-blur-md border-b border-ink/5 sticky top-0 z-20">
    <div class="max-w-[1600px] mx-auto px-5 sm:px-8 h-[68px] flex items-center justify-between">
      <div class="flex items-center gap-3 flex-none">
        <a href="/" aria-label="홈(대시보드)으로" class="flex-none hover:opacity-80 transition"><img src="/assets/HANCOM.png" alt="HANCOM" class="h-7 w-auto flex-none" /></a>
        <span class="w-px h-5 bg-ink/20 flex-none hidden sm:block"></span>
        <div class="font-display font-bold text-xl tracking-tight">AX Biz Radar</div>
        <span class="hidden md:inline text-sm font-medium opacity-80">AX 레이더 : 시장의 동향 포착에서 인사이트까지</span>
      </div>
      <div class="flex items-center gap-4 flex-none">
        <nav data-nav-links class="hidden sm:flex items-center gap-6"></nav>
        <button data-nav-mobile aria-label="메뉴" class="sm:hidden p-1.5 rounded-lg hover:bg-ink/10"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      </div>
    </div>
  </nav>

  <!-- ===== Hero 검색 (상단 바로 검색 · 인앱 답변으로 이탈 방지) ===== -->
  <div class="flex-none bg-beige border-b border-ink/5">
    <div class="max-w-[1600px] mx-auto px-5 sm:px-8 py-4">
      <div class="max-w-[820px] mx-auto relative">
        <form id="heroSearch" class="relative">
          <span class="absolute left-5 top-1/2 -translate-y-1/2 opacity-40 pointer-events-none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </span>
          <input id="heroQ" type="text" maxlength="500" autocomplete="off"
            placeholder="조달청과 관련된 AX 기업 정리해줘."
            class="w-full rounded-full bg-white border border-ink/10 py-3.5 pl-14 pr-28 text-base focus:outline-none focus:ring-2 focus:ring-lime shadow-sm" />
          <button type="submit" id="heroBtn" class="absolute right-2 top-1/2 -translate-y-1/2 rounded-full bg-ink text-lime font-semibold text-sm px-5 py-2.5 hover:bg-ink/90 disabled:opacity-40 transition">검색</button>
        </form>
        <div class="flex flex-wrap justify-center gap-2 mt-3" id="heroChips"></div>
        <div id="heroAnswer" class="hidden absolute left-0 right-0 top-full mt-2 bg-white rounded-2xl border border-ink/10 shadow-2xl shadow-ink/15 p-5 z-30 max-h-[60vh] overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <!-- ===== Main ===== -->
  <main class="flex-1 min-h-0">
    <div class="max-w-[1600px] mx-auto px-5 sm:px-8 py-6 h-full flex flex-col gap-6">

      <div class="flex-1 min-h-0 flex flex-col lg:flex-row gap-6">

        <!-- Left: knowledge graph (전체 누적) -->
        <aside class="w-full lg:w-[42%] flex-none h-[360px] lg:h-auto">
          <div class="sn-reveal h-full bg-ink text-white rounded-[28px] p-7 relative overflow-hidden flex flex-col">
            <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-lime/40 to-transparent"></div>
            <div class="flex items-center justify-between">
              <div class="text-sm font-bold uppercase tracking-widest text-lime">Knowledge Graph</div>
              <div class="text-[10px] uppercase tracking-widest opacity-75">기업 · 태그 관계망</div>
            </div>

            <!-- graph svg -->
            <div class="flex-1 min-h-0 my-2" id="graph"></div>

            <!-- stats -->
            <div class="flex items-end gap-7 pt-5 border-t border-white/10">
              <div>
                <div class="font-display font-bold text-5xl text-lime leading-none" id="statTotal">0</div>
                <div class="text-[11px] font-semibold uppercase tracking-widest opacity-75 mt-2">취합 데이터</div>
              </div>
              <div class="flex flex-wrap gap-x-6 gap-y-1 pb-1">
                <div class="text-sm"><span class="font-display font-bold text-xl" id="statCompanies">0</span> <span class="opacity-75">추적 기업</span></div>
                <div class="text-sm"><span class="font-display font-bold text-xl" id="statDates">0</span> <span class="opacity-75">분석일</span></div>
                <div class="text-sm" id="statTagsBox"><span class="font-display font-bold text-xl" id="statTags">0</span><span class="font-display text-base opacity-55" id="statTagsAll"></span> <span class="opacity-75">태그</span></div>
              </div>
            </div>
          </div>
        </aside>

        <!-- Right: kanban (세로 스윔레인) -->
        <div class="col-scroll flex-1 min-w-0 min-h-0 overflow-visible lg:overflow-y-auto flex flex-col gap-8 pr-0 lg:pr-1">

          <section>
            <div class="flex items-end justify-between border-b border-ink/10 pb-3 mb-4">
              <div class="flex items-baseline gap-3">
                <div class="text-xs font-bold uppercase tracking-widest text-lime-600">Enterprise</div>
                <h3 class="text-2xl font-display font-bold tracking-tight">대기업</h3>
              </div>
              <span class="font-display font-bold text-xl opacity-25" id="cnt-large">0</span>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start" id="col-large"></div>
          </section>

          <section>
            <div class="flex items-end justify-between border-b border-ink/10 pb-3 mb-4">
              <div class="flex items-baseline gap-3">
                <div class="text-xs font-bold uppercase tracking-widest text-lime-600">Mid-market</div>
                <h3 class="text-2xl font-display font-bold tracking-tight">중견기업</h3>
              </div>
              <span class="font-display font-bold text-xl opacity-25" id="cnt-mid">0</span>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start" id="col-mid"></div>
          </section>

          <section>
            <div class="flex items-end justify-between border-b border-ink/10 pb-3 mb-4">
              <div class="flex items-baseline gap-3">
                <div class="text-xs font-bold uppercase tracking-widest text-lime-600">Startup · SMB</div>
                <h3 class="text-2xl font-display font-bold tracking-tight">스타트업·중소</h3>
              </div>
              <span class="font-display font-bold text-xl opacity-25" id="cnt-startup">0</span>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start" id="col-startup"></div>
          </section>

        </div>
      </div>

      <!-- Bottom: 접기/펼치기 캘린더 카드 (C안) -->
      <div class="sn-reveal flex-none bg-white rounded-[24px] border border-ink/5 shadow-xl shadow-ink/5 overflow-hidden">
        <!-- 요약 행 (항상 표시) -->
        <div class="px-5 sm:px-7 py-3 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-1.5">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="text-lime-600 flex-none"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              <span class="text-[10px] font-bold uppercase tracking-widest text-lime-600" id="briefKindBadge">주간</span>
            </div>
            <span class="font-display font-bold text-sm" id="periodLabelSummary">—</span>
            <span class="w-px h-4 bg-ink/10 hidden sm:block"></span>
            <span class="hidden sm:flex items-baseline gap-1.5">
              <span class="font-display font-bold text-base" id="briefCountSummary">0</span>
              <span class="text-xs opacity-50">건</span>
            </span>
            <span class="w-px h-4 bg-ink/10 hidden md:block"></span>
            <span class="hidden md:block text-xs opacity-40" id="briefBreakdownSummary"></span>
          </div>
          <button id="calToggleBtn" class="flex items-center gap-1 text-xs font-semibold opacity-40 hover:opacity-80 transition-opacity">
            <span id="calToggleLbl">캘린더 펼치기</span>
            <svg id="calToggleChev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="transition:transform .2s"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>

        <!-- 펼친 내용 -->
        <div id="calBody">
          <div class="p-5 sm:p-6 flex flex-col lg:flex-row gap-5 border-t border-ink/5">
            <!-- 좌: 컨트롤 + 캘린더 (항상 가로 나란히) -->
            <div class="flex gap-4 flex-none">
              <!-- 기간 네비 + 모드 토글 (세로 스택) -->
              <div class="flex-none flex flex-col gap-2 justify-start pt-px">
                <div class="flex items-center gap-1">
                  <button id="periodPrev" aria-label="이전 기간" class="w-7 h-7 rounded-full hover:bg-ink/8 flex items-center justify-center text-sm opacity-40 transition-colors">‹</button>
                  <div class="font-display font-bold text-xs text-center min-w-[108px]" id="periodLabel">—</div>
                  <button id="periodNext" aria-label="다음 기간" class="w-7 h-7 rounded-full hover:bg-ink/8 flex items-center justify-center text-sm opacity-40 transition-colors">›</button>
                </div>
                <div class="inline-flex rounded-full bg-white border border-ink/10 p-0.5 shadow-sm" id="modeToggle">
                  <button data-mode="day" class="px-3 py-1 rounded-full text-xs font-semibold">일</button>
                  <button data-mode="week" class="px-3 py-1 rounded-full text-xs font-semibold">주</button>
                  <button data-mode="month" class="px-3 py-1 rounded-full text-xs font-semibold">월</button>
                </div>
                <div class="flex items-center gap-1.5 text-[10px] opacity-25">
                  <span class="w-1.5 h-1.5 rounded-full bg-lime-600 inline-block"></span>데이터 있는 날짜
                </div>
              </div>
              <!-- 캘린더 -->
              <div class="flex-none">
                <div class="grid grid-cols-7 gap-y-1 w-[245px]" id="calGrid"></div>
              </div>
            </div>
            <!-- 브리핑 -->
            <div class="flex-1 min-w-0 lg:border-l lg:border-ink/6 lg:pl-6 flex flex-col gap-4">
              <div class="flex items-end gap-3 flex-wrap">
                <span class="font-display font-bold leading-none" style="font-size:52px" id="briefCount">0</span>
                <span class="text-sm opacity-40 pb-2">건</span>
                <div id="briefWeekly" class="pb-1.5 flex-none"></div>
              </div>
              <div class="flex gap-2">
                <div class="flex-1 bg-beige rounded-xl px-3 py-2.5">
                  <div class="font-display font-bold text-2xl leading-none" id="briefLarge">0</div>
                  <div class="text-[10px] uppercase tracking-widest opacity-40 mt-1">대기업</div>
                </div>
                <div class="flex-1 bg-beige rounded-xl px-3 py-2.5">
                  <div class="font-display font-bold text-2xl leading-none" id="briefMid">0</div>
                  <div class="text-[10px] uppercase tracking-widest opacity-40 mt-1">중견</div>
                </div>
                <div class="flex-1 bg-beige rounded-xl px-3 py-2.5">
                  <div class="font-display font-bold text-2xl leading-none" id="briefStartup">0</div>
                  <div class="text-[10px] uppercase tracking-widest opacity-40 mt-1">스타트업</div>
                </div>
              </div>
              <div class="flex flex-wrap gap-1.5" id="briefTags"></div>
              <div id="briefExtra"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/entry.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ontology.js"></script>
<script src="assets/js/graph.js"></script>
<script src="assets/js/dashboard.js"></script>
<script src="assets/js/ask-fab.js"></script>
<script src="assets/js/nav.js"></script>
<script src="/assets/js/dev-toolbar.js"></script>

</body>
</html>
