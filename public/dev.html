<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DEV 검수·배포 — AX Biz Radar</title>
<link rel="icon" type="image/png" href="/assets/hancom_favicon.png" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<script>
  tailwind.config = { theme: { extend: {
    colors: { lime:'#c8f200', beige:'#f7f5f0', ink:'#111', 'lime-600':'#7ba500' },
    fontFamily: { sans:['Inter','sans-serif'], display:['"Space Grotesk"','sans-serif'] },
  } } };
</script>
<style>
  body { background:#f7f5f0; color:#111; font-family:'Inter',sans-serif; }
  h1,h2,h3 { font-family:'Space Grotesk',sans-serif; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm bg-white rounded-[24px] border border-ink/5 shadow-xl shadow-ink/5 p-7">
    <div class="flex items-center gap-2 mb-1">
      <span class="font-display font-bold tracking-tight">AX Biz Radar</span>
      <span class="text-[10px] font-bold uppercase tracking-widest bg-ink text-lime rounded-full px-2 py-0.5">DEV</span>
    </div>
    <h1 class="font-display font-bold text-xl tracking-tight mb-1">검수·배포 콘솔</h1>
    <p class="text-sm opacity-60 mb-5">관리자 PIN으로 입장하면 실사이트를 <b>미배포(draft) 합본</b>으로 미리보기하고 배포할 수 있습니다.</p>
    <form id="gate" class="space-y-3">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="관리자 PIN"
        class="w-full rounded-full bg-beige border border-ink/10 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-lime" />
      <button type="submit" id="go" class="w-full rounded-full bg-ink text-lime font-semibold text-sm px-4 py-2.5 hover:opacity-90 disabled:opacity-40">입장</button>
      <div id="err" class="text-xs text-red-500 hidden"></div>
    </form>
    <a href="/" class="block mt-4 text-xs text-ink/50 hover:text-ink">← 대시보드로</a>
  </div>

<script src="/assets/js/api.js"></script>
<script>
  const f = document.getElementById('gate'), pin = document.getElementById('pin'), go = document.getElementById('go'), err = document.getElementById('err');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const v = pin.value.trim();
    if (!v) return;
    go.disabled = true; err.classList.add('hidden');
    try {
      const ok = await API.devVerifyPin(v);
      if (ok) { try { sessionStorage.setItem('devPin', v); } catch {} location.href = '/?preview=1'; }
      else { err.textContent = 'PIN이 올바르지 않습니다.'; err.classList.remove('hidden'); }
    } catch {
      err.textContent = '확인 중 오류가 발생했습니다.'; err.classList.remove('hidden');
    } finally { go.disabled = false; }
  });
</script>
</body>
</html>
