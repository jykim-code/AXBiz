<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DEV 검수·배포 콘솔 — AX Biz Radar</title>
<link rel="icon" type="image/png" href="/assets/hancom_favicon.png" />
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<script>
  tailwind.config = { theme: { extend: {
    colors: { lime:'#c8f200', beige:'#f7f5f0', ink:'#111', 'lime-600':'#7ba500' },
    fontFamily: { sans:['Inter','sans-serif'], display:['"Space Grotesk"','sans-serif'] },
  } } };
</script>
<style>
  body { background:#f7f5f0; color:#111; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4 { font-family:'Space Grotesk',sans-serif; }
  .field { width:100%; border:1px solid rgba(17,17,17,.12); border-radius:12px; padding:8px 12px; font-size:14px; background:#fff; }
  .field:focus { outline:none; border-color:#c8f200; box-shadow:0 0 0 2px rgba(200,242,0,.4); }
  .lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:#7ba500; }
  .btn { border-radius:9999px; font-weight:600; transition:all .15s; cursor:pointer; }
</style>
</head>
<body class="min-h-screen">

<!-- PIN 게이트 -->
<div id="gate" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm bg-white rounded-[24px] border border-ink/5 shadow-xl shadow-ink/5 p-7">
    <div class="flex items-center gap-2 mb-1"><span class="font-display font-bold tracking-tight">AX Biz Radar</span><span class="text-[10px] font-bold uppercase tracking-widest bg-ink text-lime rounded-full px-2 py-0.5">DEV</span></div>
    <h1 class="font-display font-bold text-xl tracking-tight mb-1">검수·배포 콘솔</h1>
    <p class="text-sm opacity-60 mb-5">관리자 PIN으로 입장합니다.</p>
    <form id="gateForm" class="space-y-3">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="관리자 PIN" class="field rounded-full" />
      <button type="submit" id="go" class="btn w-full bg-ink text-lime text-sm px-4 py-2.5 hover:opacity-90 disabled:opacity-40">입장</button>
      <div id="gateErr" class="text-xs text-red-500 hidden"></div>
    </form>
    <a href="/" class="block mt-4 text-xs text-ink/50 hover:text-ink">← 대시보드로</a>
  </div>
</div>

<!-- 콘솔 -->
<div id="console" class="hidden">
  <nav class="bg-ink text-white sticky top-0 z-20">
    <div class="max-w-[1080px] mx-auto px-6 h-16 flex items-center gap-3">
      <span class="font-display font-bold tracking-tight">AX Biz Radar</span>
      <span class="text-[10px] font-bold uppercase tracking-widest bg-lime text-ink rounded-full px-2 py-0.5">DEV 검수·배포</span>
      <span id="cCount" class="text-xs opacity-70"></span>
      <span class="flex-1"></span>
      <a href="/?preview=1" class="btn text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5">실사이트 프리뷰 ↗</a>
      <button id="cPublishAll" class="btn text-xs bg-lime text-ink px-4 py-1.5 hover:opacity-90">전체 배포 ▶</button>
    </div>
  </nav>

  <main class="max-w-[1080px] mx-auto px-6 py-8 space-y-8">
    <section class="bg-white rounded-[20px] border border-ink/5 shadow-xl shadow-ink/5 p-6">
      <div class="lbl mb-2">① 컨플 가져오기 → draft</div>
      <div class="flex flex-col sm:flex-row gap-2">
        <input class="field flex-1" id="confUrl" placeholder="컨플 페이지 URL (/pages/<id> 또는 /wiki/x/ 단축링크)" />
        <button class="btn bg-ink text-lime px-5 py-2.5 text-sm hover:opacity-90 flex-none" id="importBtn">draft로 가져오기</button>
      </div>
      <p class="text-xs opacity-55 mt-2">파싱 후 아래 검수 목록에 쌓입니다. <b>라이브에는 아직 반영되지 않습니다.</b> 같은 페이지 재가져오기는 기존 draft 갱신.</p>
      <div id="importMsg" class="text-xs font-semibold mt-2 hidden"></div>
    </section>

    <section>
      <div class="flex items-end justify-between mb-4">
        <div><h2 class="text-xl font-bold tracking-tight">② 검수 목록</h2><p class="text-sm opacity-60" id="counts">불러오는 중…</p></div>
      </div>
      <div id="list" class="space-y-6"></div>
      <div id="empty" class="hidden text-center py-16 text-ink/45">검수할 draft가 없습니다. 위에서 컨플을 가져오세요.</div>
    </section>
  </main>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-ink text-white text-sm rounded-full px-5 py-2.5 opacity-0 transition-opacity z-50"></div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/util.js"></script>
<script>
const esc = (s) => (typeof escapeHtml === 'function' ? escapeHtml(s) : String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])));
const DIFF = { 'new': ['🆕 신규', 'bg-lime/20 text-lime-600'], 'replace': ['✏️ 교체', 'bg-amber-100 text-amber-700'] };
const CATS = ['대기업', '중견기업', '스타트업·중소'];
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.opacity = '1'; setTimeout(() => t.style.opacity = '0', 2400); }

/* ===== PIN 게이트 ===== */
async function tryShowConsole() {
  if (!sessionStorage.getItem('devPin')) return false;
  try { await API.devDrafts(); return true; } catch { sessionStorage.removeItem('devPin'); return false; }
}
async function boot() {
  if (await tryShowConsole()) { showConsole(); }
}
document.getElementById('gateForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = document.getElementById('pin').value.trim(); if (!v) return;
  const go = document.getElementById('go'), err = document.getElementById('gateErr');
  go.disabled = true; err.classList.add('hidden');
  try {
    if (await API.devVerifyPin(v)) { sessionStorage.setItem('devPin', v); showConsole(); }
    else { err.textContent = 'PIN이 올바르지 않습니다.'; err.classList.remove('hidden'); }
  } catch { err.textContent = '확인 중 오류.'; err.classList.remove('hidden'); }
  finally { go.disabled = false; }
});

function showConsole() {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('console').classList.remove('hidden');
  document.getElementById('importBtn').onclick = doImport;
  document.getElementById('cPublishAll').onclick = () => confirmPublish({ all: true }, '검수 목록 전체를');
  refresh();
}

/* ===== 검수 목록 ===== */
let DRAFTS = [];
async function refresh() {
  try {
    const res = await API.devDrafts();
    DRAFTS = res.drafts || [];
    document.getElementById('counts').textContent = 'draft ' + DRAFTS.length + '건 · 🆕 ' + DRAFTS.filter(d=>d.diff==='new').length + ' · ✏️ ' + DRAFTS.filter(d=>d.diff==='replace').length;
    document.getElementById('cCount').textContent = '미배포 ' + DRAFTS.length + '건';
    render();
  } catch (e) {
    if (e.status === 403) { sessionStorage.removeItem('devPin'); location.reload(); }
  }
}
function bullets(arr) { return (arr||[]).map(t=>'<li>'+esc(t)+'</li>').join(''); }
function sect(label, arr) { return (arr&&arr.length) ? '<div><span class="lbl">'+label+'</span><ul class="list-disc pl-5 opacity-85 text-sm">'+bullets(arr)+'</ul></div>' : ''; }
function cardHTML(x) {
  const [bt, bc] = DIFF[x.diff] || DIFF['new']; const d = x.data || {};
  return '<div class="bg-white rounded-2xl border border-ink/5 shadow-xl shadow-ink/5 p-5" data-id="'+x.id+'">'+
    '<div class="flex items-center gap-2 flex-wrap mb-2">'+
      '<span class="text-[11px] font-bold rounded-full px-2 py-0.5 '+bc+'">'+bt+'</span>'+
      '<span class="font-display font-bold">'+esc(x.company)+'</span>'+
      '<span class="text-[10px] font-semibold bg-beige rounded-full px-2 py-0.5">'+esc(x.category||'')+'</span>'+
      '<span class="text-xs opacity-55 ml-auto">'+esc(x.date)+'</span></div>'+
    (d.summary ? '<p class="text-sm font-semibold mb-2">'+esc(d.summary)+'</p>' : '')+
    '<div class="space-y-1.5">'+sect('주요 내용', d.keyPoints)+sect('시사점', d.implications)+sect('한컴 인사이트', d.hancomInsight)+'</div>'+
    '<div class="flex flex-wrap gap-1.5 mt-2">'+(d.tags||[]).map(t=>'<span class="text-xs bg-beige border border-ink/5 rounded-full px-2.5 py-0.5">#'+esc(t)+'</span>').join('')+'</div>'+
    '<div class="flex items-center gap-2 mt-4 pt-3 border-t border-ink/5">'+
      '<button class="btn text-xs border border-ink/15 px-3 py-1.5 hover:bg-beige" data-act="edit">편집</button>'+
      '<button class="btn text-xs border border-ink/15 px-3 py-1.5 hover:bg-red-500 hover:text-white hover:border-red-500" data-act="del">삭제</button>'+
      '<button class="btn text-xs bg-ink text-lime px-4 py-1.5 ml-auto hover:opacity-90" data-act="pub">이 건 배포</button>'+
    '</div></div>';
}
function render() {
  const byDate = {}; DRAFTS.forEach(x => (byDate[x.date] = byDate[x.date] || []).push(x));
  const dates = Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
  document.getElementById('empty').classList.toggle('hidden', DRAFTS.length>0);
  const list = document.getElementById('list');
  list.innerHTML = dates.map(dt =>
    '<div><div class="flex items-center gap-3 mb-2"><div class="font-display font-bold text-lg">'+dt+'</div><div class="h-px flex-1 bg-ink/10"></div>'+
    '<button class="btn text-xs bg-beige px-3 py-1.5 hover:bg-lime" data-pubdate="'+dt+'">이 날짜 배포</button></div>'+
    '<div class="space-y-3">'+byDate[dt].map(cardHTML).join('')+'</div></div>').join('');
  // 배선
  list.querySelectorAll('[data-pubdate]').forEach(b => b.onclick = () => confirmPublish({ dates:[b.getAttribute('data-pubdate')] }, b.getAttribute('data-pubdate')+' 날짜를'));
  list.querySelectorAll('[data-id]').forEach(card => {
    const id = +card.getAttribute('data-id');
    card.querySelector('[data-act="del"]').onclick = async () => { try { await API.devDeleteDraft(id); toast('삭제됨'); refresh(); } catch { toast('삭제 실패'); } };
    card.querySelector('[data-act="pub"]').onclick = () => confirmPublish({ ids:[id] }, '이 1건을');
    card.querySelector('[data-act="edit"]').onclick = () => openEdit(card, id);
  });
}

/* ===== 인라인 편집 ===== */
function openEdit(card, id) {
  const x = DRAFTS.find(d => d.id === id); if (!x) return; const d = x.data || {};
  const ta = (v) => esc((v||[]).join('\n'));
  card.innerHTML = '<div class="space-y-2">'+
    '<div class="flex items-center gap-2"><b class="font-display">'+esc(x.company)+'</b><span class="text-xs opacity-55">'+esc(x.date)+'</span>'+
      '<select class="field !w-auto ml-auto text-xs py-1" data-f="category">'+CATS.map(c=>'<option '+(c===x.category?'selected':'')+'>'+c+'</option>').join('')+'</select></div>'+
    '<div><span class="lbl">한 줄 요약</span><input class="field" data-f="summary" value="'+esc(d.summary||'')+'"></div>'+
    '<div><span class="lbl">주요 내용 (줄당 1개)</span><textarea class="field" rows="3" data-f="keyPoints">'+ta(d.keyPoints)+'</textarea></div>'+
    '<div><span class="lbl">시사점</span><textarea class="field" rows="2" data-f="implications">'+ta(d.implications)+'</textarea></div>'+
    '<div><span class="lbl">한컴 인사이트</span><textarea class="field" rows="2" data-f="hancomInsight">'+ta(d.hancomInsight)+'</textarea></div>'+
    '<div><span class="lbl">태그 (쉼표)</span><input class="field" data-f="tags" value="'+esc((d.tags||[]).join(', '))+'"></div>'+
    '<div class="flex gap-2 pt-1"><button class="btn text-xs bg-ink text-lime px-4 py-1.5" data-save>저장</button><button class="btn text-xs border border-ink/15 px-3 py-1.5 hover:bg-beige" data-cancel>취소</button></div>'+
  '</div>';
  const g = (f) => card.querySelector('[data-f="'+f+'"]').value;
  const lines = (f) => g(f).split('\n').map(s=>s.trim()).filter(Boolean);
  card.querySelector('[data-cancel]').onclick = () => render();
  card.querySelector('[data-save]').onclick = async () => {
    try {
      await API.devUpdateDraft(id, { summary: g('summary'), category: g('category'), keyPoints: lines('keyPoints'), implications: lines('implications'), hancomInsight: lines('hancomInsight'), tags: g('tags').split(',').map(s=>s.trim()).filter(Boolean) });
      toast('저장됨'); refresh();
    } catch { toast('저장 실패'); }
  };
}

/* ===== 배포 ===== */
function confirmPublish(payload, label) {
  if (!confirm(label + ' 라이브에 배포할까요?\n배포하면 본 사이트에 즉시 반영되고 같은 (날짜·기업) 항목은 교체됩니다.')) return;
  API.devPublish(payload).then(r => { toast((r.publishedIds?r.publishedIds.length:0) + '건 배포됨 → 라이브 반영'); refresh(); })
    .catch(e => toast('배포 실패: ' + (e.status || e.message)));
}

function doImport() {
  const url = document.getElementById('confUrl').value.trim(); const msg = document.getElementById('importMsg');
  if (!url) return;
  msg.className = 'text-xs opacity-55 mt-2'; msg.textContent = '가져오는 중…'; msg.classList.remove('hidden');
  API.devImport(url).then(r => { msg.className = 'text-xs text-lime-600 font-semibold mt-2'; msg.textContent = '✓ '+r.name+' · draft '+r.count+'건 가져옴'; document.getElementById('confUrl').value=''; refresh(); })
    .catch(e => { msg.className = 'text-xs text-red-500 mt-2'; msg.textContent = '실패: ' + ((e.data && (e.data.hint||e.data.error)) || e.status || e.message); });
}

boot();
</script>
</body>
</html>
