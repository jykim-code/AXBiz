<!DOCTYPE html>
<html lang="ko">

<link rel="icon" type="image/png" href="/assets/hancom_favicon.png" />
<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = { theme: { extend: {
    colors: { lime: '#c8f200', beige: '#f7f5f0', ink: '#111', 'lime-600': '#7ba500' },
    fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'], display: ['"Space Grotesk"','ui-sans-serif','system-ui','sans-serif'] },
  }}};
</script>
<style>
  body { background:#f7f5f0; color:#111; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }

<body class="min-h-screen bg-beige">

    <a href="/" aria-label="홈(대시보드)으로" class="flex-none hover:opacity-80 transition"><img src="/assets/HANCOM.png" alt="HANCOM" class="h-6 w-auto" /></a>
    <span class="hidden sm:inline w-px h-5 bg-ink/20"></span>
    <span class="font-display font-semibold text-sm">기업</span>
  </header>

  <main class="max-w-[1000px] w-full mx-auto px-5 sm:px-8 py-6">
    <div class="flex flex-wrap gap-2 mb-5" id="compList"></div>
    <div id="compDetail"></div>
  </main>

<script src="/assets/js/util.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ontology.js"></script>
<script src="/assets/js/company.js"></script>
<script src="/assets/js/sidebar.js"></script>
