<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>기업 — AX Biz Radar</title>
<link rel="icon" type="image/png" href="/assets/hancom_favicon.png" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<script>
  tailwind.config = { theme: { extend: {
    colors: { lime: '#c8f200', beige: '#f7f5f0', ink: '#111', 'lime-600': '#7ba500' },
    fontFamily: { sans: ['Inter','Pretendard','ui-sans-serif','system-ui','sans-serif'], display: ['"Space Grotesk"','Pretendard','ui-sans-serif','system-ui','sans-serif'] },
  }}};
</script>
<style>
  body { background:#f7f5f0; color:#111; font-family:'Inter','Pretendard',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4,h5,h6 { font-family:'Space Grotesk','Pretendard',sans-serif; }
  ::selection { background:#c8f200; color:#111; }
  /* 주요 동향 카드 — 최신 1건만 펼친 상태로 시작, 헤더 클릭으로 토글.
     동향이 많은 기업에서 페이지가 과도하게 길어지지 않게 하려는 목적. */
  .trend-head { width:100%; text-align:left; padding:1.25rem; }
  .trend-body { display:none; padding:0 1.25rem 1.25rem; }
  .trend-card.is-open .trend-head { padding-bottom:.75rem; }
  .trend-card.is-open .trend-body { display:block; }
  .trend-card.is-open .trend-preview { display:none; }
  .trend-card.is-open .trend-chevron { transform:rotate(180deg); }
  @media (min-width:640px) {
    .trend-head { padding:1.5rem; }
    .trend-body { padding:0 1.5rem 1.5rem; }
    .trend-card.is-open .trend-head { padding-bottom:.75rem; }
  }
</style>
<link rel="stylesheet" href="/assets/css/dark.css" />
<script>!function(){var s=localStorage.getItem('ax-dark');if(s==='1'||(s===null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}()</script>
</head>
<body class="min-h-screen bg-beige">
  <header class="h-[68px] bg-lime/90 backdrop-blur-md border-b border-ink/5 sticky top-0 z-20">
    <div class="max-w-[1600px] mx-auto px-5 sm:px-8 h-full flex items-center justify-between">
      <div class="flex items-center gap-3 flex-none">
        <a href="/" aria-label="홈(대시보드)으로" class="flex-none hover:opacity-80 transition"><img src="/assets/HANCOM.png" alt="HANCOM" class="h-6 w-auto" /></a>
        <span class="hidden sm:inline w-px h-5 bg-ink/20 flex-none"></span>
        <span class="font-display font-semibold text-sm">기업</span>
      </div>
      <div class="flex items-center gap-4 flex-none">
        <nav data-nav-links class="hidden sm:flex items-center gap-6"></nav>
        <button data-nav-mobile aria-label="메뉴" class="sm:hidden p-1.5 rounded-lg hover:bg-ink/10"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      </div>
    </div>
  </header>

  <main class="max-w-[1280px] w-full mx-auto px-5 sm:px-8 py-6">
    <!-- 그리드 뷰(기본). ?name= 진입 시 숨기고 상세를 보여준다. -->
    <div id="compBrowse">
      <!-- 에디토리얼 헤딩 -->
      <div class="mb-8 sm:mb-12">
        <p class="text-sm font-bold uppercase tracking-widest text-lime-600 mb-3">Companies</p>
        <h2 class="text-3xl md:text-4xl lg:text-5xl font-display font-bold tracking-tight mb-4">원하는 기업을 선택해<br class="hidden sm:block" /> 동향을 파악하세요.</h2>
        <p class="text-lg sm:text-xl text-ink/70 max-w-2xl">추적 중인 기업의 시점별 AX 동향·시사점·한컴 인사이트를 모아 봅니다.</p>
      </div>
      <!-- 컨트롤 -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-5">
        <input id="cq" placeholder="기업명·태그·내용 검색…" class="flex-1 bg-white border border-ink/10 rounded-full px-5 py-3 text-sm focus:outline-none focus:border-lime" />
        <button id="sortToggle" class="flex-none text-xs font-semibold border border-ink/15 rounded-full px-4 py-3 hover:border-lime transition-colors">정렬: 최신순</button>
      </div>
      <div class="flex flex-wrap items-center gap-2 mb-6" id="catFilter"></div>
      <div class="text-xs text-ink/60 mb-4" id="compCount"></div>
      <div id="compGrid" class="grid md:grid-cols-2 gap-6 scroll-mt-24"></div>
      <div id="compPager"></div>
    </div>
    <div id="compDetail"></div>
  </main>

<script src="/assets/js/util.js"></script>
<script src="/assets/js/entry.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ontology.js"></script>
<script src="/assets/js/company-alias.js"></script>
<script src="/assets/js/company.js"></script>
<script src="/assets/js/ask-fab.js"></script>
<script src="/assets/js/nav.js"></script>
<script src="/assets/js/dev-toolbar.js"></script>
<!-- Cloudflare Web Analytics -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "240ee2f2866040e2be8949596c8150ce"}'></script>
<!-- End Cloudflare Web Analytics -->
</body>
</html>
