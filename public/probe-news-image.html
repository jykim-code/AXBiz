<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>기사 사진 사용 가능성 확인</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<script>
  tailwind.config = { theme: { extend: {
    colors: { lime: '#c8f200', beige: '#f7f5f0', ink: '#111', 'lime-600': '#7ba500', panel: '#161616' },
    fontFamily: { sans: ['Inter','Pretendard','sans-serif'], display: ['"Space Grotesk"','Pretendard','sans-serif'] },
  }}};
</script>
<style>
  body { font-family:'Inter','Pretendard',sans-serif; background:#0b0b0b; color:#fff; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Space Grotesk','Pretendard',sans-serif; }
</style>
</head>
<body class="p-5 sm:p-8">

<!-- 확인 전용 페이지다. 어디에도 링크하지 않고, 확인이 끝나면 엔드포인트와 함께 지운다.
     보려는 것 세 가지 —
       ① 엣지(Cloudflare)에서도 기사 HTML 을 받아 og:image 를 뽑을 수 있나
       ② 그 이미지를 우리 페이지에서 바로 걸었을 때 깨지지 않나 (핫링크 차단 여부)
       ③ 620px 슬라이드 비주얼 판에 넣었을 때 흐릿함·잘림이 실제로 어느 정도인가 -->

<div class="max-w-[1100px] mx-auto">
  <h1 class="font-display font-bold text-[26px] tracking-tight">기사 사진 사용 가능성 확인</h1>
  <p class="text-[13px] text-white/45 mt-2 leading-relaxed">
    엣지에서 <code class="text-lime">og:image</code> 를 뽑아 실제 슬라이드 판(620px)에 넣어 본다.
    회차 데이터에는 아무것도 저장하지 않는다. 법적 사용 가능 여부와는 별개로 <b class="text-white/70">기술적으로 되는지</b>만 본다.
  </p>

  <div class="mt-6 flex flex-wrap gap-2 items-center">
    <input id="url" type="url" placeholder="기사 주소 붙여넣기 (추적 매체만 허용)"
      class="flex-1 min-w-[280px] bg-white/[.06] border border-white/10 rounded-lg px-3 py-2 text-[13px] placeholder:text-white/25" />
    <button id="run" class="bg-lime text-ink font-bold text-[13px] px-4 py-2 rounded-lg">확인</button>
    <button id="runAll" class="bg-white/10 hover:bg-white/20 font-semibold text-[13px] px-4 py-2 rounded-lg">샘플 5건 한번에</button>
  </div>
  <div id="samples" class="mt-2 flex flex-wrap gap-1.5"></div>

  <!-- 슬라이드 판 조건. 실제 프리뷰(weekly-preview-news.html)의 비주얼 판은
       620 폭 × clamp(210px, 34%, 300px) 이므로 그 범위를 그대로 재현한다. -->
  <div class="mt-6 flex flex-wrap items-center gap-4 text-[12px] border-t border-white/10 pt-4">
    <span class="text-white/35 font-semibold">판 높이</span>
    <div id="hBtns" class="flex gap-1"></div>
    <span class="text-white/35 font-semibold ml-2">잘리는 기준점</span>
    <div id="pBtns" class="flex gap-1"></div>
    <label class="ml-auto flex items-center gap-2 text-white/50">
      <input id="overlay" type="checkbox" checked class="accent-lime" /> 활자 겹쳐 보기
    </label>
  </div>

  <div id="out" class="mt-7 space-y-8"></div>
</div>

<script>
/* 앞서 사내망에서 확인할 때 실제로 뽑아 둔 기사들. 엣지에서도 같은 결과가 나오는지 비교용이다. */
const SAMPLES = [
  ['aitimes', 'https://www.aitimes.com/news/articleView.html?idxno=214269'],
  ['aitimes', 'https://www.aitimes.com/news/articleView.html?idxno=214263'],
  ['etnews',  'https://www.etnews.com/20260821000252'],
  ['etnews',  'https://www.etnews.com/20260823000045'],
  ['zdnet',   'https://zdnet.co.kr/view/?no=20260823233523'],
];

/* PIN 은 기존 관례를 따른다(localStorage.devPin). /admin 에 한 번 들어와 있으면 그대로 쓰인다. */
function pin() {
  try {
    let p = localStorage.getItem('devPin') || sessionStorage.getItem('devPin') || '';
    if (!p) { p = prompt('관리자 PIN') || ''; if (p) localStorage.setItem('devPin', p); }
    return p;
  } catch { return ''; }
}

const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const out = document.getElementById('out');

let PANEL_H = 260;              // 판 높이 (210 / 260 / 300)
let PANEL_POS = 'center';       // object-position — 사진에서 어디를 남기고 자를지
const HEIGHTS = [210, 260, 300];
const POSITIONS = [['top', '위'], ['center', '가운데'], ['bottom', '아래']];

function chips(host, arr, cur, on) {
  host.innerHTML = '';
  arr.forEach(([v, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = 'px-2.5 py-1 rounded-full font-semibold ' + (v === cur ? 'bg-lime text-ink' : 'bg-white/10 hover:bg-white/20');
    b.onclick = () => on(v);
    host.appendChild(b);
  });
}
function paintControls() {
  chips(document.getElementById('hBtns'), HEIGHTS.map((h) => [h, h + 'px']), PANEL_H, (v) => { PANEL_H = v; paintControls(); reflow(); });
  chips(document.getElementById('pBtns'), POSITIONS, PANEL_POS, (v) => { PANEL_POS = v; paintControls(); reflow(); });
}
/* 조건을 바꿀 때 다시 확인을 돌릴 이유가 없다 — 이미 그려 둔 판만 고쳐 잡는다. */
function reflow() {
  document.querySelectorAll('[data-panel]').forEach((el) => { el.style.height = PANEL_H + 'px'; });
  document.querySelectorAll('[data-cover]').forEach((el) => { el.style.objectPosition = PANEL_POS; });
}

document.getElementById('samples').innerHTML = SAMPLES.map(([h, u], i) =>
  '<button data-s="' + i + '" class="text-[11px] px-2 py-1 rounded-full bg-white/[.07] hover:bg-white/15 text-white/60">' + h + ' #' + (i + 1) + '</button>').join('');
document.getElementById('samples').addEventListener('click', (e) => {
  const b = e.target.closest('[data-s]');
  if (b) { document.getElementById('url').value = SAMPLES[Number(b.dataset.s)][1]; run(SAMPLES[Number(b.dataset.s)][1]); }
});

function card(url) {
  const el = document.createElement('div');
  el.className = 'border border-white/10 rounded-xl overflow-hidden';
  el.innerHTML = '<div class="px-4 py-2.5 bg-white/[.04] text-[12px] text-white/50 break-all">' + esc(url) +
    '</div><div class="p-4 text-[13px] text-white/40">엣지에 물어보는 중…</div>';
  out.prepend(el);
  return el;
}

/* 판정 한 줄. 620 폭 판을 고밀도 화면에서 선명하게 채우려면 원본 폭이 1,240px 이상이어야 한다. */
function verdict(w, h) {
  if (!w) return ['?', '크기를 읽지 못함', 'text-white/40'];
  if (w >= 1240) return ['선명', w + '×' + h + ' — 620px 판을 채우기에 충분', 'text-lime'];
  if (w >= 620) return ['흐림', w + '×' + h + ' — 620px 판에 맞지만 고밀도 화면에서 뭉개짐', 'text-yellow-400'];
  return ['부족', w + '×' + h + ' — 620px 판보다 작아 늘려야 함', 'text-red-400'];
}

async function run(url) {
  if (!url) return;
  const el = card(url);
  let d;
  try {
    const r = await fetch('/api/dev/og-image?url=' + encodeURIComponent(url), {
      headers: { Accept: 'application/json', 'x-admin-pin': pin() },
    });
    d = await r.json();
    if (r.status === 403) { el.querySelector('div:last-child').innerHTML = '<span class="text-red-400">PIN 이 맞지 않습니다.</span>'; return; }
  } catch (e) {
    el.querySelector('div:last-child').innerHTML = '<span class="text-red-400">호출 실패: ' + esc(e.message) + '</span>';
    return;
  }

  if (!d.image) {
    el.querySelector('div:last-child').innerHTML =
      '<div class="text-[13px]"><span class="text-red-400 font-bold">이미지 주소를 못 뽑았습니다</span>' +
      '<div class="text-white/40 mt-1">사유 ' + esc(d.reason || d.error || d.stage || '알 수 없음') + '</div>' +
      '<pre class="mt-2 text-[11px] text-white/30 whitespace-pre-wrap">' + esc(JSON.stringify(d, null, 1).slice(0, 600)) + '</pre></div>';
    return;
  }

  const img = d.image;
  const st = (x) => !x ? '—' : (x.error ? '<span class="text-red-400">' + esc(x.error) + '</span>'
    : (x.status === 200 ? '<span class="text-lime">200</span>' : '<span class="text-red-400">' + x.status + '</span>') +
      ' <span class="text-white/35">' + esc(x.type || '') + (x.bytes ? ' · ' + Math.round(x.bytes / 1024) + 'KB' : '') + '</span>');

  el.querySelector('div:last-child').outerHTML =
    '<div class="grid lg:grid-cols-[620px_1fr] gap-5 p-4 items-start">' +

    // ── 실제 슬라이드 비주얼 판 (620px) ──
    '<div>' +
      '<div class="text-[10px] font-bold uppercase tracking-widest text-white/30 mb-2">슬라이드 비주얼 판 실제 크기</div>' +
      '<div class="relative overflow-hidden bg-panel" data-panel style="width:620px;max-width:100%;height:' + PANEL_H + 'px">' +
        '<img data-cover src="' + esc(img.url) + '" alt="" referrerpolicy="no-referrer-when-downgrade" ' +
          'class="absolute inset-0 w-full h-full object-cover" style="object-position:' + PANEL_POS + '" ' +
          'onerror="this.dataset.broken=1;this.style.display=\'none\';this.parentElement.querySelector(\'[data-broken-msg]\').style.display=\'block\'" />' +
        '<div data-broken-msg style="display:none" class="absolute inset-0 flex items-center justify-center text-[13px] text-red-400 bg-panel">브라우저에서 이미지가 막혔습니다 (핫링크 차단)</div>' +
        // 실제 조판에서 활자가 사진 위에 얹히므로 가독성까지 같이 본다
        '<div data-ov class="absolute inset-0 p-6 flex flex-col justify-between pointer-events-none">' +
          '<div class="font-display font-bold text-[22px] tracking-tight text-white drop-shadow">기업명</div>' +
          '<div><div class="font-display font-bold text-[58px] leading-none tracking-tighter text-white drop-shadow">16곳</div>' +
          '<div class="text-[12px] font-semibold text-white/80 mt-1.5 drop-shadow">컨소시엄 참여 기관</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="mt-2 text-[11px] text-white/30">잘리는 기준점을 바꿔 보면 무엇이 사라지는지 보입니다</div>' +
    '</div>' +

    // ── 판정 ──
    '<div class="text-[12.5px] space-y-2.5">' +
      '<div data-verdict class="font-bold text-[14px]">크기 읽는 중…</div>' +
      '<div class="grid grid-cols-[128px_1fr] gap-y-1.5">' +
        '<span class="text-white/35">기사 HTML</span><span>' +
          (d.article.status === 200 ? '<span class="text-lime">200</span>' : '<span class="text-red-400">' + d.article.status + '</span>') +
          ' <span class="text-white/35">' + d.article.ms + 'ms · ' + Math.round(d.article.bytes / 1024) + 'KB</span></span>' +
        '<span class="text-white/35">이미지 (Referer 없음)</span><span>' + st(img.noReferer) + '</span>' +
        '<span class="text-white/35">이미지 (우리 도메인)</span><span>' + st(img.ourReferer) + '</span>' +
        '<span class="text-white/35">HTML 선언 크기</span><span class="text-white/50">' + esc(img.declared || '없음') + '</span>' +
      '</div>' +
      '<div class="pt-2 border-t border-white/10">' +
        '<div class="text-white/35 mb-1">원본 전체</div>' +
        '<img src="' + esc(img.url) + '" alt="" class="max-w-[260px] w-full border border-white/10" />' +
        '<div class="text-[11px] text-white/25 mt-1.5 break-all">' + esc(img.url.split('/').pop()) + '</div>' +
      '</div>' +
    '</div></div>';

  // 실제 픽셀 크기는 브라우저가 받아 봐야 안다 (CORS 없이도 naturalWidth 는 읽힌다)
  const probe = new Image();
  probe.onload = () => {
    const [tag, msg, cls] = verdict(probe.naturalWidth, probe.naturalHeight);
    const v = el.querySelector('[data-verdict]');
    if (v) v.innerHTML = '<span class="' + cls + '">' + tag + '</span> <span class="text-white/50 font-normal text-[12.5px]">' + esc(msg) + '</span>';
  };
  probe.onerror = () => {
    const v = el.querySelector('[data-verdict]');
    if (v) v.innerHTML = '<span class="text-red-400">브라우저에서 못 받음</span> <span class="text-white/50 font-normal text-[12.5px]">핫링크가 막혔거나 원본이 사라진 경우</span>';
  };
  probe.src = img.url;
}

document.getElementById('run').onclick = () => run(document.getElementById('url').value.trim());
document.getElementById('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(e.target.value.trim()); });
document.getElementById('runAll').onclick = async () => { for (const [, u] of SAMPLES) await run(u); };
document.getElementById('overlay').onchange = (e) => {
  document.querySelectorAll('[data-ov]').forEach((x) => { x.style.display = e.target.checked ? 'flex' : 'none'; });
};

paintControls();
</script>
</body>
</html>
