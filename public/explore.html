<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>탐색 — AX Biz Radar</title>
<link rel="icon" type="image/png" href="/assets/hancom_favicon.png" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<script>
  tailwind.config = { theme: { extend: {
    colors: { lime: '#c8f200', beige: '#f7f5f0', ink: '#111', 'lime-600': '#7ba500' },
    fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'], display: ['"Space Grotesk"','ui-sans-serif','system-ui','sans-serif'] },
  }}};
</script>
<style>
  body { background:#f7f5f0; color:#111; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4,h5,h6 { font-family:'Space Grotesk',sans-serif; }
  ::selection { background:#c8f200; color:#111; }
</style>
</head>
<body class="min-h-screen bg-beige">
  <header class="h-20 bg-lime/90 backdrop-blur-md border-b border-ink/5 sticky top-0 z-20 flex items-center gap-3 px-5 sm:px-8">
    <button data-sb-open aria-label="메뉴 열기" class="-ml-1 p-1 rounded-lg hover:bg-ink/10"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <a href="/" aria-label="홈(대시보드)으로" class="flex-none hover:opacity-80 transition"><img src="/assets/HANCOM.png" alt="HANCOM" class="h-6 w-auto" /></a>
    <span class="hidden sm:inline w-px h-5 bg-ink/20"></span>
    <span class="font-display font-semibold text-sm">탐색</span>
  </header>

  <main class="max-w-[1100px] w-full mx-auto px-5 sm:px-8 py-6">
    <!-- 자연어 질문(RAG) -->
    <div class="bg-white rounded-[20px] border border-ink/5 shadow-xl shadow-ink/5 p-5 sm:p-6 mb-5">
      <p class="text-[11px] font-semibold tracking-[0.18em] text-lime-600 uppercase mb-1">Ask</p>
      <h1 class="font-display font-bold tracking-tight text-xl sm:text-2xl mb-3">무엇이든 물어보세요</h1>
      <form id="askForm">
        <textarea id="question" rows="2" maxlength="500"
          placeholder="예) 최근 AI 에이전트를 도입한 대기업은? · 한컴이 주목할 만한 스타트업 동향은?"
          class="w-full resize-none border border-ink/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-lime"></textarea>
        <div class="flex items-center justify-between mt-3">
          <span class="text-xs opacity-75"><span id="qLen">0</span>/500 · 수집된 자료를 근거로 답합니다</span>
          <button type="submit" id="askBtn"
            class="bg-ink text-lime font-semibold text-sm rounded-full px-5 py-2.5 hover:opacity-90 disabled:opacity-40 transition">질문</button>
        </div>
      </form>
      <!-- 답변·출처 -->
      <div id="answerCard" class="hidden mt-5 pt-5 border-t border-ink/5"></div>
    </div>

    <!-- 태그·키워드로 탐색(브라우즈 / 폴백) -->
    <div id="browse" class="scroll-mt-24 bg-white rounded-[20px] border border-ink/5 shadow-xl shadow-ink/5 p-5 mb-5">
      <p class="text-[11px] font-semibold tracking-[0.18em] text-lime-600 uppercase mb-3">또는 태그·키워드로 탐색</p>
      <input id="q" placeholder="기업명·주요내용·시사점·한컴인사이트·태그 전체 검색…" class="w-full border border-ink/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-lime" />
      <div class="flex flex-wrap gap-2 mt-3" id="tagcloud"></div>
      <div class="text-xs opacity-75 mt-3" id="expCount"></div>
    </div>
    <div id="expResults" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>

<script src="/assets/js/util.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ontology.js"></script>
<script src="/assets/js/explore.js"></script>
<script src="/assets/js/sidebar.js"></script>
</body>
</html>
