<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>검색 — AX Biz Radar</title>
<link rel="icon" type="image/png" href="/assets/hancom_favicon.png" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<script>
  tailwind.config = { theme: { extend: {
    colors: { lime: '#c8f200', beige: '#f7f5f0', ink: '#111', 'lime-600': '#7ba500' },
    fontFamily: { sans: ['Inter','Pretendard','ui-sans-serif','system-ui','sans-serif'], display: ['"Space Grotesk"','Pretendard','ui-sans-serif','system-ui','sans-serif'] },
  }}};
</script>
<style>
  body { background:#f7f5f0; color:#111; font-family:'Inter','Pretendard',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4,h5,h6 { font-family:'Space Grotesk','Pretendard',sans-serif; }
  ::selection { background:#c8f200; color:#111; }
</style>
</head>
<body class="min-h-screen bg-beige">
  <header class="h-20 bg-lime/90 backdrop-blur-md border-b border-ink/5 sticky top-0 z-20 flex items-center gap-3 px-5 sm:px-8">
    <button data-sb-open aria-label="메뉴 열기" class="-ml-1 p-1 rounded-lg hover:bg-ink/10"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <a href="/" aria-label="홈(대시보드)으로" class="flex-none hover:opacity-80 transition"><img src="/assets/HANCOM.png" alt="HANCOM" class="h-6 w-auto" /></a>
    <span class="hidden sm:inline w-px h-5 bg-ink/20"></span>
    <span class="font-display font-semibold text-sm">검색</span>
  </header>

  <main class="max-w-[1100px] w-full mx-auto px-5 sm:px-8 py-6">
    <!-- 에디토리얼 헤딩 (기업 페이지와 동일 톤) -->
    <div class="mb-8 sm:mb-10">
      <p class="text-sm font-bold uppercase tracking-widest text-lime-600 mb-3">Ask</p>
      <h1 class="text-3xl md:text-4xl lg:text-5xl font-display font-bold tracking-tight mb-4">무엇이든 물어보세요.</h1>
      <p class="text-lg sm:text-xl text-ink/70 max-w-2xl">수집된 자료를 근거로, 출처와 함께 답해 드립니다.</p>
    </div>

    <!-- 자연어 질문(RAG) -->
    <div class="bg-white rounded-[28px] border border-ink/5 shadow-xl shadow-ink/5 p-6 sm:p-8 mb-8">
      <form id="askForm">
        <div class="flex items-center gap-2">
          <textarea id="question" rows="1" maxlength="500"
            placeholder="예) 최근 AX 플랫폼을 출시한 대기업은? · 한컴이 주목할 만한 스타트업 동향은?"
            class="flex-1 resize-none overflow-hidden border border-ink/10 rounded-full px-5 py-3 text-sm leading-snug focus:outline-none focus:border-lime"></textarea>
          <button type="submit" id="askBtn"
            class="flex-none bg-ink text-lime font-semibold text-sm rounded-full px-6 py-3 hover:opacity-90 disabled:opacity-40 transition">검색</button>
        </div>
        <div class="mt-2 pl-5 text-xs text-ink/60"><span id="qLen">0</span>/500 · RAG 검색 · 수집된 자료를 근거로 <b class="font-semibold text-ink/75">Qwen3.7-plus</b>가 답합니다</div>
      </form>
      <!-- 답변·출처 -->
      <div id="answerCard" class="hidden mt-5 pt-5 border-t border-ink/5"></div>
    </div>

    <!-- 태그·키워드로 탐색(브라우즈 / 폴백) -->
    <div id="browse" class="scroll-mt-24 mb-5">
      <p class="text-sm font-bold uppercase tracking-widest text-lime-600 mb-3">또는 태그·키워드로 검색</p>
      <input id="q" placeholder="기업명·주요내용·시사점·한컴인사이트·태그 전체 검색…" class="w-full bg-white border border-ink/10 rounded-full px-5 py-3 text-sm focus:outline-none focus:border-lime" />
      <div class="flex flex-wrap gap-2 mt-3" id="tagcloud"></div>
      <div class="text-xs text-ink/60 mt-3" id="expCount"></div>
    </div>
    <div id="expResults" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>

<script src="/assets/js/util.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ontology.js"></script>
<script src="/assets/js/explore.js"></script>
<script src="/assets/js/ask-fab.js"></script>
<script src="/assets/js/sidebar.js"></script>
<script src="/assets/js/dev-toolbar.js"></script>
</body>
</html>
