    '<p class="text-[13px] text-ink/45 leading-relaxed">금주 픽에서 도출한 결론</p></div>' +
    '<div class="space-y-3">' + D.hancom.map((x) => '<p class="text-[14px] leading-[1.7]">' + esc(x) + '</p>').join('') + '</div></div>';
  h += '</div>';

  // 전체폭 섹션 (C)
  D.picks.forEach((p, i) => {
    const dark = i % 2 === 1;
    h += '<section id="f' + i + '" class="mt-12 py-10 ' + (dark ? 'bg-ink text-white' : '') + '">' +
      '<div class="max-w-[1000px] mx-auto px-5 sm:px-8 grid sm:grid-cols-[120px,1fr] gap-x-8">' +
      '<div class="font-display font-bold text-[72px] leading-none ' + (dark ? 'text-lime/30' : 'num-out') + '">' + pad2(i + 1) + '</div>' +
      '<div><div class="flex items-baseline gap-3 mb-2">' +
      '<h2 class="text-[28px] sm:text-[34px] font-bold tracking-tight leading-none">' + esc(p.company) + '</h2>' +
      '<span class="text-[11px] ' + (dark ? 'text-white/45' : 'text-ink/40') + '">' + esc(p.category) + ' · ' + esc(p.date) + '</span></div>' +
      '<p class="text-[17px] font-semibold leading-snug mb-4 max-w-[50ch]">' + esc(p.title) + '</p>' +
      '<p class="text-[14px] leading-[1.75] mb-6 pl-4 border-l-2 border-lime max-w-[56ch]">' + esc(p.why) + '</p>' +
      '<div class="grid sm:grid-cols-3 gap-x-6 gap-y-4">' +
      BODY.map((b) => '<div><div class="text-[10px] font-bold uppercase tracking-widest ' + (dark ? 'text-lime' : 'text-ink/35') + ' mb-1.5">' + b.label + '</div>' +
        '<ul class="space-y-1.5 text-[12.5px] leading-[1.7] ' + (dark ? 'text-white/75' : 'text-ink/80') + '">' + p[b.k].map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></div>').join('') +
      '</div>' +
      '<div class="text-[11px] ' + (dark ? 'text-white/30' : 'text-ink/35') + ' mt-4">' + p.tags.map((t) => '#' + t).join(' ') + '</div>' +
      '</div></div></section>';
  });

  h += '<div class="max-w-[1000px] mx-auto px-5 sm:px-8 mt-12 pb-14 rule pt-4 text-[14px] flex flex-wrap gap-x-6">' +
    '<a href="#" class="font-semibold hover:text-lime-600">금주 동향 ' + D.stats.total + '건 전체 →</a>' +
    '<a href="#" class="font-semibold hover:text-lime-600">기업 찾아보기 →</a>' +
    '<a href="#" class="font-semibold hover:text-lime-600">자료 검색 →</a></div>';
  return h + '</div>';
}

/* ===== 스위처 ===== */
const VARIANTS = [
  { key: 'F', name: 'C + 다크 수치', fn: variantF, bg: 'bg-beige',
    note: 'C(매거진 인덱스) 골격에 E 의 수치 영역을 전체폭 다크 밴드로 끼운 안. 요약(라이트) → 수치(다크) → 목차(라이트) → 픽 섹션(짝수 다크)으로 명암이 번갈아 리듬이 된다. 다크 밴드에 대형 라임 숫자·키워드·4주 추이·신규 편입 기업을 한 덩어리로 담았다.' },
  { key: 'A', name: '에디토리얼', fn: variantA, bg: 'bg-beige',
    note: '신문·잡지 조판. 박스와 그림자를 전혀 쓰지 않고 굵은 선·얇은 선·활자 크기로만 구분한다. 본문을 2단으로 흘려 길이가 부담스럽지 않다. 「발행물」 느낌이 가장 강하지만 모바일에서 2단이 1단으로 접혀 길어진다.' },
  { key: 'B', name: '타임라인', fn: variantB, bg: 'bg-beige',
    note: '좌측 세로선을 따라 흐르는 형태. 한 주의 순서가 그대로 보이고 스크롤 동선이 명확하다. 대시보드의 기업 타임라인과 문법이 같아 학습 비용이 없다. 다만 항목 수가 늘면 선이 계속 길어진다.' },
  { key: 'C', name: '매거진 인덱스', fn: variantC, bg: 'bg-beige',
    note: '상단에 큰 목차를 두고 아래로 전체폭 섹션이 이어진다. 목차에서 무엇이 실렸는지 3초 안에 파악되고, 짝수 섹션을 다크로 반전해 리듬을 만든다. 데스크톱에서 가장 좋고 모바일에서는 3열 본문이 1열로 접힌다.' },
  { key: 'D', name: '데이터시트', fn: variantD, bg: 'bg-white',
    note: '표 중심 고밀도. 모노스페이스로 「자료」 성격을 강조한다. 스캔이 가장 빠르고 항목이 20건으로 늘어도 형태가 무너지지 않는다. 다만 단톡방 공유물로는 정서적으로 딱딱하고 읽는 재미가 없다.' },
  { key: 'E', name: '다크 풀블리드', fn: variantE, bg: 'bg-ink',
    note: '페이지 전체가 다크. 라임이 가장 강하게 살고 발행물 무게가 크다. 대시보드 지식그래프 카드와 톤이 이어진다. 다만 본문이 길면 다크에서 눈이 빨리 피로하고, 인쇄·캡처 공유에 불리하다.' },
];

const tabs = document.getElementById('tabs');
const stage = document.getElementById('stage');
const note = document.getElementById('note');
let cur = 'F';

function paint() {
  const v = VARIANTS.find((x) => x.key === cur);
  document.body.className = v.bg + ' text-ink';
  stage.innerHTML = v.fn();
  note.textContent = v.key + '. ' + v.name + ' — ' + v.note;
  tabs.querySelectorAll('button').forEach((b) => {
    b.className = 'text-[12px] font-semibold rounded-full px-3 py-1.5 transition-colors ' +
      (b.dataset.k === cur ? 'bg-lime text-ink' : 'bg-white/10 text-white/70 hover:bg-white/20');
  });
  window.scrollTo(0, 0);
}
tabs.innerHTML = VARIANTS.map((v) => '<button data-k="' + v.key + '">' + v.key + '. ' + v.name + '</button>').join('');
tabs.querySelectorAll('button').forEach((b) => (b.onclick = () => { cur = b.dataset.k; paint(); }));
paint();
</script>
</body>
</html>
