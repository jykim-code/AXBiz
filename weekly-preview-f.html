<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>위클리 픽 — F안 (매거진 인덱스 + 목차 앞 수치)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<script>
  tailwind.config = { theme: { extend: {
    colors: { lime: '#c8f200', beige: '#f7f5f0', ink: '#111', 'lime-600': '#7ba500' },
    fontFamily: { sans: ['Inter','Pretendard','sans-serif'], display: ['"Space Grotesk"','Pretendard','sans-serif'] },
  }}};
</script>
<style>
  body { font-family:'Inter','Pretendard',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Space Grotesk','Pretendard',sans-serif; }
  ::selection { background:#c8f200; color:#111; }
  /* 카드(그림자·라운드 박스)를 쓰지 않는다. 구분은 굵은 선·얇은 선·활자 위계로만 한다. */
  .rule      { border-top:2px solid #111; }
  .rule-thin { border-top:1px solid rgba(17,17,17,.14); }
  .num-out   { -webkit-text-stroke:1.5px rgba(17,17,17,.22); color:transparent; }
</style>
</head>
<body class="bg-beige text-ink">
<div id="stage"></div>

<script>
/* ===== 실제 데이터 (2026-W34 초안) ===== */
const D = {
  issueNo: 1, label: '2026년 8월 3주', range: '8/17 ~ 8/23', published: '2026-08-21',
  overview: '모두의 AI 공모에서 중견 SW·통신사 대규모 컨소시엄이 공공 AI 주관사로 등장한 가운데, 차별화된 에이전틱 AI 성능과 모델 중립 전략이 정부 평가의 별도 항목으로 부상하며 후속 조달 경쟁의 비교 기준이 다양화되는 흐름',
  hancom: [
    '여러 국산 모델을 결합한 KT 컨소시엄 구성과 LG CNS의 에이전틱 AI 차별성 평가 부상으로 한컴 Agentic OS의 모델 중립성·조율·권한 통제 성능을 정량 증빙하는 시급성 확대',
    'ESTsoft 컨소시엄과 폴라리스오피스의 공공 AI 진입으로 문서 소프트웨어 진영 경로가 형성되었으나 대국민 서비스와 기업 내부 시스템 조율 계층이 구분되므로 한컴 차별화 지점은 폐쇄망 배포와 권한 통제가 붙은 실행 환경에 집중',
    'LG AI연구원 독파모 3차 진출을 통해 LG CNS 오케스트레이션과의 직접 경합 가능성이 높아진 만큼 한컴 Agentic OS는 모델 신뢰성과 에이전트 협업 조율 성능을 정부 평가 기준에 맞춰 정리할 필요',
  ],
  stats: { total: 33, companies: 25, newCo: 11, picks: 3 },
  picks: [
    {
      company: 'ESTsoft', category: '스타트업·중소', date: '08-19',
      title: '모두의 AI 공모에 컨소시엄 주관사로 접수',
      why: '중견 SW 컨소시엄이 공공 AI 주관사로 등장하며 대기업 통신사와 플랫폼 기업 중심의 경쟁 구도를 벗어난 새로운 사업 참여 경로가 형성된 점',
      keyPoints: ['모두의 AI 공모에 컨소시엄 주관사로 접수','참여사는 메가존, 와이즈넛, 폴라리스오피스, 슈어소프트테크','대기업 통신사와 플랫폼 기업 사이에서 중견 사업자 주관 컨소시엄으로 참여'],
      implications: ['중견 소프트웨어 기업이 주관사로 나선 유일한 구성이며 통신사 대비 인프라 열위를 파트너로 보완','문서 소프트웨어 사업자 폴라리스오피스가 컨소시엄에 편입된 점이 사업 범위상 특이 사항','메가존과 와이즈넛 편입으로 클라우드 운영과 에이전트 구축 역량을 외부 조달'],
      hancomInsight: ['폴라리스오피스가 국가 단위 AI 서비스 사업 컨소시엄에 들어간 사례이므로 문서 소프트웨어 진영의 공공 AI 진입 경로로 추적 필요','다만 이번 사업 범위는 대국민 챗봇과 공공 AI 에이전트이며 기업 업무 조율 계층과는 구분됨','한컴 차별화 지점은 폐쇄망 배포와 권한 통제가 붙은 실행 환경이며 대국민 서비스 실적과는 평가 기준이 다름'],
      tags: ['모두의AI','폴라리스오피스','메가존클라우드','컨소시엄','문서소프트웨어'],
    },
    {
      company: 'KT', category: '대기업', date: '08-19',
      title: '정부 모두의 AI 사업 공모에 컨소시엄 주관사로 참여 발표, 참여 기관 16곳',
      why: 'KT의 대규모 컨소시엄 구성과 모델 중립 전략이 한컴 Agentic OS와 접근 방식을 공유하나, 공공 AI 에이전트 시장 내 후속 조달 경합 가능성 점검 필요',
      keyPoints: ['정부 모두의 AI 사업 공모에 컨소시엄 주관사로 참여 발표, 참여 기관 16곳','AI 서비스 영역 참여사는 다음, 솔트룩스, 무신사, 직방, 커넥트웨이브, 매스프레소, EBS, BC카드, 딥서치','AI 모델·플랫폼 영역 참여사는 업스테이지, 모티프테크놀로지스, NC AI, 액션파워','자사 모델 믿:음에 솔라, 모티프, 배키를 결합하는 구성으로 모델 라인업 확대'],
      implications: ['독파모에서 탈락한 모티프를 모델 영역에 편입해 국산 모델 다중 탑재 구성을 확보','생활 서비스 사업자를 다수 묶어 서비스 다양성 항목에서 평가 우위를 노리는 구성','모델 개발보다 운영·유통 역량을 제안 근거로 제시한 포지셔닝'],
      hancomInsight: ['여러 국산 모델을 한 서비스에 결합하는 구성이라 한컴 Agentic OS의 모델 중립 구조와 접근 방식이 같은 지점','다만 대상이 대국민 챗봇과 공공 AI 에이전트이며 기업 내부 시스템 조율 계층은 아님','공공 AI 에이전트 구축이 사업 범위에 포함된 만큼 후속 기관 확산 단계에서 조달 경합 가능성 점검 필요'],
      tags: ['모두의AI','컨소시엄','믿음','업스테이지','공공AI에이전트','모델중립'],
    },
    {
      company: 'LG AI연구원', category: '대기업', date: '08-18',
      title: '독파모 2차 단계평가 통과, 3차 단계 진출 확정',
      why: '에이전틱 AI 차별성과 모델 신뢰성이 정부 평가의 별도 항목으로 부상하며, 한컴 Agentic OS의 조율·권한 통제 성능과 모델 중립 전략에 대한 정량적 증빙 필요성 확대',
      keyPoints: ['독파모 2차 단계평가 통과, 3차 단계 진출 확정','전문가위원회 평가에서 글로벌 협업 전략, 에이전틱 AI 차별성, 모델 신뢰성에서 높은 평가','4개 정예팀 개발 모델 4종이 에포크 AI의 2026년 주목할 만한 AI 모델에 등재'],
      implications: ['정부 평가에서 에이전틱 AI 차별성이 별도 평가 항목으로 작동한 첫 사례','LG 진영은 LG AI연구원 모델과 LG CNS 플랫폼·SI를 묶어 계열 단위로 AX 스택을 구성','모델 신뢰성 평가는 규제 산업 조달에서 요구되는 항목과 직결'],
      hancomInsight: ['LG AI연구원 모델과 LG CNS 오케스트레이션이 결합하면 에이전트 조율 계층에서 한컴과 직접 경합 가능','에이전틱 AI 차별성이 정부 평가 항목이 된 만큼 한컴도 조율·권한 통제 성능을 정량 자료로 제시할 필요','모델 신뢰성 항목은 한컴이 모델 중립 구조에서 어떤 모델을 기본 탑재할지 결정하는 판단 근거'],
      tags: ['독파모','에이전틱AI','모델신뢰성','에포크AI'],
    },
  ],
};

const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad2 = (n) => String(n).padStart(2, '0');
const BODY = [
  { k: 'keyPoints', label: '주요 내용' },
  { k: 'implications', label: '시사점' },
  { k: 'hancomInsight', label: '한컴 인사이트' },
];

function render() {
  let h = '<div class="py-12">';

  /* 헤더 — 좌: 회차 라벨 + 주차 제목 / 우: 기간·발행일.
     건수는 아래 수치 줄에 있으므로 여기 넣지 않는다. */
  h += '<div class="max-w-[1000px] mx-auto px-5 sm:px-8">';
  h += '<div class="flex items-end justify-between rule-thin pb-4 mb-8">' +
    '<div><div class="text-[11px] font-bold uppercase tracking-[.2em] text-lime-600 mb-1.5">Weekly Picks No.' + pad2(D.issueNo) + '</div>' +
    '<h1 class="text-[40px] sm:text-[52px] font-bold tracking-tighter leading-none">' + esc(D.label) + '</h1></div>' +
    '<div class="text-right text-[12px] text-ink/45 leading-relaxed">' + D.range + '<br/>발행 ' + D.published + '</div></div>';

  // 금주 한 줄 요약 — 이 페이지에서 가장 큰 본문 활자
  h += '<p class="text-[20px] sm:text-[24px] font-display font-medium leading-[1.5] max-w-[38ch] mb-10">' + esc(D.overview) + '</p>';

  /* 수치 — 기업 목차 바로 앞. 박스·칩·막대를 쓰지 않고 세로 얇은 선으로만 나눈다
     (목차를 가로선으로 나누는 것과 같은 문법). */
  h += '<div class="rule pt-5 mb-10 grid grid-cols-2 sm:grid-cols-4 divide-y sm:divide-y-0 sm:divide-x divide-ink/10">' +
    [['금주 동향', D.stats.total], ['등장 기업', D.stats.companies], ['신규 기업', D.stats.newCo], ['Weekly Picks', D.stats.picks]]
      .map(([k, v], i) => '<div class="' + (i === 0 ? 'sm:pr-6' : 'sm:px-6') + ' py-3 sm:py-0">' +
        '<div class="font-display font-bold text-[34px] sm:text-[40px] leading-none tracking-tighter">' + v + '</div>' +
        '<div class="text-[10px] font-semibold uppercase tracking-widest text-ink/40 mt-2">' + k + '</div></div>').join('') + '</div>';

  // 기업 목차 — 행 단위, 클릭하면 해당 섹션으로
  h += '<div class="rule pt-3">' + D.picks.map((p, i) =>
    '<a href="#f' + i + '" class="group flex items-baseline gap-4 py-3.5 rule-thin first:border-t-0 hover:bg-lime/20 transition-colors">' +
    '<span class="font-display font-bold text-[13px] text-lime-600 w-6">' + pad2(i + 1) + '</span>' +
    '<span class="font-display font-bold text-[20px] sm:text-[24px] tracking-tight">' + esc(p.company) + '</span>' +
    '<span class="text-[13px] text-ink/55 hidden sm:block truncate flex-1">' + esc(p.title) + '</span>' +
    '<span class="text-[11px] text-ink/35 ml-auto flex-none">' + esc(p.date) + '</span></a>').join('') + '</div>';

  // 한컴 관점 — 좌: 라벨 + 설명 / 우: 결론 불릿
  h += '<div class="mt-10 grid sm:grid-cols-[1fr,1fr] gap-x-10 gap-y-3 rule pt-5">' +
    '<div><div class="text-[11px] font-bold uppercase tracking-widest text-lime-600 mb-2">한컴 관점</div>' +
    '<p class="text-[13px] text-ink/45 leading-relaxed">금주 픽에서 도출한 결론</p></div>' +
    '<div class="space-y-3">' + D.hancom.map((x) => '<p class="text-[14px] leading-[1.7]">' + esc(x) + '</p>').join('') + '</div></div>';
  h += '</div>';

  // 픽 — 전체폭 섹션. 짝수 섹션을 다크로 반전해 리듬을 만든다.
  D.picks.forEach((p, i) => {
    const dark = i % 2 === 1;
    h += '<section id="f' + i + '" class="mt-12 py-10 ' + (dark ? 'bg-ink text-white' : '') + '">' +
      '<div class="max-w-[1000px] mx-auto px-5 sm:px-8 grid sm:grid-cols-[120px,1fr] gap-x-8">' +
      '<div class="font-display font-bold text-[72px] leading-none ' + (dark ? 'text-lime/30' : 'num-out') + '">' + pad2(i + 1) + '</div>' +
      '<div><div class="flex items-baseline gap-3 mb-2">' +
      '<h2 class="text-[28px] sm:text-[34px] font-bold tracking-tight leading-none">' + esc(p.company) + '</h2>' +
      '<span class="text-[11px] ' + (dark ? 'text-white/45' : 'text-ink/40') + '">' + esc(p.category) + ' · ' + esc(p.date) + '</span></div>' +
      '<p class="text-[17px] font-semibold leading-snug mb-4 max-w-[50ch]">' + esc(p.title) + '</p>' +
      // 주목(Pick) 이유 — 라임 좌측 바. 이 페이지에서 사람이 판단해 쓴 유일한 문장이다.
      '<p class="text-[14px] leading-[1.75] mb-6 pl-4 border-l-2 border-lime max-w-[56ch]">' + esc(p.why) + '</p>' +
      '<div class="grid sm:grid-cols-3 gap-x-6 gap-y-4">' +
      BODY.map((b) => '<div><div class="text-[10px] font-bold uppercase tracking-widest ' + (dark ? 'text-lime' : 'text-ink/35') + ' mb-1.5">' + b.label + '</div>' +
        '<ul class="space-y-1.5 text-[12.5px] leading-[1.7] ' + (dark ? 'text-white/75' : 'text-ink/80') + '">' +
        p[b.k].map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></div>').join('') +
      '</div>' +
      '<div class="text-[11px] ' + (dark ? 'text-white/30' : 'text-ink/35') + ' mt-4">' + p.tags.map((t) => '#' + t).join(' ') + '</div>' +
      '</div></div></section>';
  });

  // 푸터 — 다음 동선
  h += '<div class="max-w-[1000px] mx-auto px-5 sm:px-8 mt-12 rule pt-4 text-[14px] flex flex-wrap gap-x-6">' +
    '<a href="#" class="font-semibold hover:text-lime-600">금주 동향 ' + D.stats.total + '건 전체 →</a>' +
    '<a href="#" class="font-semibold hover:text-lime-600">기업 찾아보기 →</a>' +
    '<a href="#" class="font-semibold hover:text-lime-600">자료 검색 →</a></div>';

  return h + '</div>';
}

document.getElementById('stage').innerHTML = render();
</script>
</body>
</html>
