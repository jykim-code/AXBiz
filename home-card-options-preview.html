<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>다건 카드 옵션 프리뷰 (2026년 5월)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<script>
  tailwind.config = { theme: { extend: {
    colors: { lime: '#c8f200', beige: '#f7f5f0', ink: '#111', 'lime-600': '#7ba500' },
    fontFamily: { sans: ['Inter','Pretendard','ui-sans-serif','sans-serif'], display: ['"Space Grotesk"','Pretendard','ui-sans-serif','sans-serif'] },
  }}};
</script>
<style>
  body { background:#f7f5f0; color:#111; font-family:'Inter','Pretendard',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4,h5,h6 { font-family:'Space Grotesk','Pretendard',sans-serif; }
  .body { display:none; }
  .open > .body { display:block; }
  .open .chev { transform:rotate(180deg); }
</style>
</head>
<body class="min-h-screen bg-beige">
  <header class="h-16 bg-lime/90 backdrop-blur-md border-b border-ink/5 flex items-center gap-3 px-5 sm:px-8">
    <span class="font-display font-semibold text-sm">다건 카드 옵션 프리뷰 — 2026년 5월</span>
  </header>

  <main class="max-w-[1100px] mx-auto px-5 sm:px-8 py-6">
    <div class="flex items-center gap-3 mb-2">
      <div class="inline-flex rounded-full bg-white border border-ink/10 p-1" id="optToggle">
        <button data-opt="1" class="px-5 py-2 rounded-full text-sm font-semibold">옵션 1 · 기업별 1카드(펼치면 날짜별)</button>
        <button data-opt="2" class="px-5 py-2 rounded-full text-sm font-semibold">옵션 2 · 건별 카드</button>
      </div>
      <span class="text-xs opacity-60" id="optDesc"></span>
    </div>
    <p class="text-xs opacity-50 mb-6">카드를 클릭하면 펼쳐집니다.</p>

    <section>
      <div class="flex items-end justify-between border-b border-ink/10 pb-3 mb-4">
        <div class="flex items-baseline gap-3"><div class="text-xs font-bold uppercase tracking-widest text-lime-600">Enterprise</div><h3 class="text-2xl font-display font-bold tracking-tight">대기업</h3></div>
        <span class="font-display font-bold text-xl opacity-25" id="cnt">0</span>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start" id="grid"></div>
    </section>
  </main>

<script>
  const esc = (s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // ===== mock 5월 데이터 (대기업, 다건 포함) =====
  const REPORTS = [
    { date:'2026-05-04', companies:[
      { name:'삼성SDS', category:'대기업', tags:['패브릭스','멀티 LLM'], keyPoints:['패브릭스에 외부 LLM(클로드·제미나이) 추가 연동 발표'], implications:['단일 모델 종속 탈피, 멀티 LLM 허브 지향'], hancomInsight:['에이전트 OS의 모델 오케스트레이션 범위 확장 참고'] },
    ]},
    { date:'2026-05-12', companies:[
      { name:'네이버', category:'대기업', tags:['커머스','에이전트'], keyPoints:['AI 쇼핑 에이전트, 능동형(선제 제안)으로 진화'], implications:['응답형→선제형 UX 이동'], hancomInsight:[] },
    ]},
    { date:'2026-05-25', companies:[
      { name:'삼성SDS', category:'대기업', tags:['패브릭스'], keyPoints:['패브릭스 2.0 로드맵 공개 — 온프레미스 옵션 예고'], implications:['보안 민감 고객(공공·금융) 겨냥'], hancomInsight:[] },
      { name:'LG CNS', category:'대기업', tags:['에이전틱웍스','SI'], keyPoints:['에이전틱웍스 플랫폼 정식 공개'], implications:['SI 강자의 자체 에이전트 플랫폼 진입'], hancomInsight:['SI 레퍼런스 기반 확산 속도 주시'] },
    ]},
    { date:'2026-05-27', companies:[
      { name:'LG CNS', category:'대기업', tags:['에이전틱웍스','공공'], keyPoints:['에이전틱웍스 공공기관 적용 사례 발표'], implications:['공공 레퍼런스 확보로 신뢰도 강화'], hancomInsight:[] },
    ]},
    { date:'2026-05-29', companies:[
      { name:'삼성SDS', category:'대기업', tags:['패브릭스','온프레미스'], keyPoints:['패브릭스 2.0 정식 출시 — 온프레미스·프라이빗 강화'], implications:['B2B 온프레미스 AX 경쟁 본격화'], hancomInsight:['온프레미스 수요처에서 한컴의 차별점(데이터 거버넌스) 부각 가능'] },
      { name:'KT DS', category:'대기업', tags:['공공 SI'], keyPoints:['공공 AX 사업 수주 확대'], implications:['통신 계열 SI의 공공 시장 공략'], hancomInsight:[] },
    ]},
  ];

  // 5월 항목만, 기업별로 모든 entry 보관(최신순)
  function byCompany() {
    const map = {};
    REPORTS.filter(r=>r.date>='2026-05-01' && r.date<='2026-05-31').forEach(r=>{
      r.companies.forEach(c=>{
        (map[c.name] = map[c.name] || { name:c.name, category:c.category, entries:[], tags:new Set() });
        map[c.name].entries.push({ date:r.date, ...c });
        (c.tags||[]).forEach(t=>map[c.name].tags.add(t));
      });
    });
    const list = Object.values(map);
    list.forEach(co=>co.entries.sort((a,b)=>b.date.localeCompare(a.date)));
    return list.sort((a,b)=>b.entries[0].date.localeCompare(a.entries[0].date) || a.name.localeCompare(b.name));
  }
  function flatEntries() {
    const arr=[];
    REPORTS.filter(r=>r.date>='2026-05-01' && r.date<='2026-05-31').forEach(r=>r.companies.forEach(c=>arr.push({ date:r.date, ...c })));
    return arr.sort((a,b)=>b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
  }

  const bullets = (a)=> (a&&a.length) ? '<ul class="space-y-2">'+a.map(x=>'<li class="text-sm leading-relaxed opacity-80 pl-4 relative before:content-[\'\'] before:absolute before:left-0 before:top-2 before:w-1.5 before:h-1.5 before:rounded-full before:bg-ink/30">'+esc(x)+'</li>').join('')+'</ul>' : '';
  function insightBox(a){ return (a&&a.length) ? '<div class="bg-lime/15 border border-lime rounded-2xl p-4"><div class="text-xs font-bold uppercase tracking-widest text-lime-600 mb-2">한컴 인사이트</div><ul class="space-y-2">'+a.map(x=>'<li class="text-sm leading-relaxed pl-4 relative before:content-[\'\'] before:absolute before:left-0 before:top-2 before:w-1.5 before:h-1.5 before:rounded-full before:bg-lime-600">'+esc(x)+'</li>').join('')+'</ul></div>' : ''; }
  function entryBlocks(e){
    let h='';
    if(e.keyPoints&&e.keyPoints.length) h+='<div><div class="text-xs font-bold uppercase tracking-widest text-lime-600 mb-2">주요 내용</div>'+bullets(e.keyPoints)+'</div>';
    if(e.implications&&e.implications.length) h+='<div><div class="text-xs font-bold uppercase tracking-widest text-lime-600 mb-2">시사점</div>'+bullets(e.implications)+'</div>';
    h+=insightBox(e.hancomInsight);
    return h;
  }
  const chev = '<span class="chev flex-none mt-1 opacity-75 transition-transform duration-300"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="m6 9 6 6 6-6"/></svg></span>';
  const cardOpen = '<div class="card bg-white rounded-[24px] border border-ink/5 shadow-xl shadow-ink/5 cursor-pointer">';

  // 옵션 1: 기업별 1카드, 펼치면 날짜별 미니 타임라인
  function card1(co){
    const latest = co.entries[0];
    const n = co.entries.length;
    let h = cardOpen + '<div class="p-6 flex items-start gap-3"><div class="flex-1 min-w-0">'+
      '<div class="flex items-center gap-2"><h4 class="font-display font-bold text-lg tracking-tight">'+esc(co.name)+'</h4>'+
        (n>1?'<span class="text-[10px] font-bold text-lime-600 bg-lime/15 rounded-full px-2 py-0.5 flex-none">'+n+'건</span>':'')+
        '<span class="text-[11px] text-ink/55 font-medium ml-auto flex-none">'+esc(latest.date)+'</span></div>'+
      '<p class="text-sm opacity-80 mt-1.5 leading-snug">'+esc((latest.keyPoints||[])[0]||'')+'</p></div>'+chev+'</div>';
    // body: 날짜별 섹션 최신순
    h += '<div class="body"><div class="px-6 pb-6">';
    h += '<div class="flex justify-end mb-3"><a href="#" class="text-xs text-lime-600 font-semibold hover:underline">기업 상세 →</a></div>';
    h += '<div class="space-y-5 border-l-2 border-lime/40 pl-5">';
    co.entries.forEach(e=>{
      h += '<div class="relative"><div class="absolute -left-[27px] top-1.5 w-3 h-3 rounded-full bg-lime border-2 border-white"></div>'+
        '<div class="text-xs font-bold text-lime-600 mb-2">'+esc(e.date)+'</div>'+
        '<div class="space-y-3">'+entryBlocks(e)+'</div></div>';
    });
    h += '</div></div></div></div>';
    return h;
  }

  // 옵션 2: 건별 카드 (날짜마다 별도)
  function card2(e){
    let h = cardOpen + '<div class="p-6 flex items-start gap-3"><div class="flex-1 min-w-0">'+
      '<div class="flex items-center gap-2"><h4 class="font-display font-bold text-lg tracking-tight">'+esc(e.name)+'</h4>'+
        '<span class="text-[11px] text-ink/55 font-medium ml-auto flex-none">'+esc(e.date)+'</span></div>'+
      '<p class="text-sm opacity-80 mt-1.5 leading-snug">'+esc((e.keyPoints||[])[0]||'')+'</p></div>'+chev+'</div>';
    h += '<div class="body"><div class="px-6 pb-6 space-y-3">'+entryBlocks(e)+'</div></div></div>';
    return h;
  }

  let opt = '1';
  function render(){
    document.querySelectorAll('#optToggle button').forEach(b=>{
      b.className='px-5 py-2 rounded-full text-sm font-semibold transition-colors '+(b.dataset.opt===opt?'bg-ink text-white':'text-ink/60 hover:text-ink');
    });
    const grid=document.getElementById('grid');
    if(opt==='1'){ const cos=byCompany(); grid.innerHTML=cos.map(card1).join(''); document.getElementById('cnt').textContent=cos.length+'개 기업';
      document.getElementById('optDesc').textContent='기업별 1카드 · 펼치면 그 달 모든 건을 날짜별로'; }
    else { const es=flatEntries(); grid.innerHTML=es.map(card2).join(''); document.getElementById('cnt').textContent=es.length+'건';
      document.getElementById('optDesc').textContent='건별(날짜별) 카드 · 같은 기업도 날짜마다 별도'; }
    grid.querySelectorAll('.card').forEach(c=>c.onclick=(ev)=>{ if(ev.target.closest('a'))return; c.classList.toggle('open'); });
  }
  document.querySelectorAll('#optToggle button').forEach(b=>b.onclick=()=>{ opt=b.dataset.opt; render(); });
  render();
</script>
</body>
</html>
